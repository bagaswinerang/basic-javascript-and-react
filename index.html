<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <form class="form" id="taskForm">
        <div class="form-group">
          <label for="taskTitle" class="form-label">
            Mau ngapain hari ini?
          </label>

          <input
            class="form-input form-input--full"
            type="text"
            id="taskTitle"
            name="taskTitle"
            placeholder="Masukkan kegiatan Anda..."
          />
        </div>
        <div class="form-group form-group--button-right">
          <button type="submit" class="button">Simpan</button>
        </div>
      </form>
      <div class="tasks">
        <h2 class="tasks-title">Agendaku</h2>
        <ul class="tasks-list" id="tasksList"></ul>
      </div>
    </div>

    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
